<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Kitty – Herzen fangen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrapper">
    <header class="hud">
      <div class="hud-item">
        <span class="label">Punkte</span>
        <span id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="label">Leben</span>
        <span id="lives">❤❤❤</span>
      </div>
      <div class="hud-item">
        <span class="label">Level</span>
        <span id="level">1</span>
      </div>
    </header>

    <div class="canvas-frame">
      <canvas id="game" width="640" height="720"></canvas>

      <div id="overlay" class="overlay">
        <div class="title-badge">
          <span class="sparkle-deco">✨</span>
          <h1>Hello Kitty</h1>
          <span class="sparkle-deco">✨</span>
        </div>
        <p class="subtitle">~ Zauber-Abenteuer ~</p>
        <div class="instructions">
          <div class="row"><span class="key">← →</span> Bewegen</div>
          <div class="row"><span class="key">🖱</span> Maus folgen</div>
          <div class="row"><span class="key">P</span> Pause</div>
          <hr />
          <div class="legend">
            <span>💖 +10</span>
            <span>🎀 +15</span>
            <span>⭐ +20</span>
            <span>🍒 +25</span>
          </div>
          <div class="warn">⚠️ Weiche ⛈ Gewitterwolken aus!</div>
        </div>
        <button id="startBtn">💖 Los geht's! 💖</button>
      </div>
    </div>

    <footer class="controls-hint">
      ← → bewegen &nbsp;·&nbsp; Maus folgen &nbsp;·&nbsp; P = Pause
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
